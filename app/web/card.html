<!doctype html>
<!-- Lane B · verdict card. card.py loads this once, then calls window.render(data) and screenshots
     900x420 at 2x. All text arrives already translated from app/i18n.json. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="static/theme.css">
<style>
  html, body { margin: 0; }
  body { width: 900px; height: 420px; background: var(--paper); font-family: var(--font); color: var(--ink);
         overflow: hidden; -webkit-font-smoothing: antialiased; }

  .ticket { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 214px;
            background: var(--stock); }
  /* faint printed guilloche lines, like security print on ticket stock */
  .ticket::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .09;
    background: repeating-linear-gradient(-18deg, var(--ink) 0 1px, transparent 1px 11px); }

  .main { position: relative; padding: 30px 34px 26px 40px; display: flex; flex-direction: column; min-width: 0; }
  .head { display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 800;
          letter-spacing: .16em; text-transform: uppercase; }
  .head .rule { flex: 1; height: 2px; background: var(--ink); opacity: .85; }
  .serial { font-family: var(--mono); font-weight: 700; letter-spacing: .04em; font-size: 15px; text-transform: none; }

  .label { margin: 22px 0 0; font-size: 50px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em;
           text-wrap: balance; }
  :lang(kn) .label, :lang(hi) .label { font-size: 44px; line-height: 1.2; letter-spacing: 0; }
  .advice { margin: 12px 0 0; font-size: 22px; line-height: 1.38; font-weight: 500; max-width: 600px; }
  .note { margin: 10px 0 0; font-size: 15px; line-height: 1.35; font-weight: 700; max-width: 600px; }
  .note::before { content: "↳ "; font-weight: 800; }

  .stages { margin-top: auto; padding-top: 14px; }
  .stage-row { display: flex; gap: 3px; height: 38px; }
  .stage { flex: 1 1 0; border: 2px solid var(--ink); border-radius: 3px; position: relative; }
  .stage.one { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 7px); }
  .stage.punched { background: var(--ink); }
  .stage.punched::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    margin: -7px 0 0 -7px; border-radius: 50%; background: var(--stock); }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono);
          font-size: 14px; font-weight: 700; }

  /* the stub, torn off along the perforation */
  .stub { position: relative; padding: 30px 26px 26px 30px; display: flex; flex-direction: column; }
  .stub::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 2px;
    background: repeating-linear-gradient(var(--ink) 0 6px, transparent 6px 13px); }
  .notch { position: absolute; left: -15px; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); }
  .notch.t { top: -15px; } .notch.b { bottom: -15px; }
  .glyph { width: 96px; height: 96px; border: 4px solid var(--ink); border-radius: 50%; display: grid;
           place-items: center; }
  .glyph svg { width: 54px; height: 54px; stroke: var(--ink); stroke-width: 9; fill: none;
               stroke-linecap: round; stroke-linejoin: round; }
  .seconds { margin-top: 18px; font-family: var(--mono); font-weight: 700; font-size: 30px; line-height: 1.05;
             letter-spacing: -.02em; }
  .seconds small { display: block; margin-top: 6px; font-family: var(--font); font-size: 14px; font-weight: 700;
                   letter-spacing: 0; }
  .by { margin-top: auto; font-size: 13px; line-height: 1.35; font-weight: 700; }
  .disclaimer { font-size: 13px; line-height: 1.35; font-weight: 500; margin-top: 8px; }

  .test { position: absolute; right: 40px; bottom: 98px; transform: rotate(-6deg); border: 3px solid var(--ink);
          padding: 3px 10px; font-weight: 800; font-size: 15px; letter-spacing: .08em; background: var(--stock); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="ticket" id="ticket">
  <section class="main">
    <div class="head"><span>Check Before Share</span><span class="rule"></span><span class="serial" id="serial"></span></div>
    <h1 class="label" id="label"></h1>
    <p class="advice" id="advice"></p>
    <p class="note" id="note" hidden></p>
    <div class="stages" id="stages">
      <div class="stage-row" id="row"></div>
      <div class="axis"><span>0</span><span id="mid"></span><span id="end"></span></div>
    </div>
    <div class="test" id="test" hidden></div>
  </section>
  <aside class="stub">
    <span class="notch t"></span><span class="notch b"></span>
    <div class="glyph" id="glyph"></div>
    <div class="seconds" id="seconds"></div>
    <div class="by" id="by"></div>
    <div class="disclaimer" id="disclaimer"></div>
  </aside>
</div>
<script>
  // one drawn mark per verdict, same stroke family everywhere
  const GLYPHS = {
    likely_fake: '<svg viewBox="0 0 60 60"><path d="M16 16 44 44M44 16 16 44"/></svg>',
    partly_fake: '<svg viewBox="0 0 60 60"><path d="M30 12v22"/><path d="M30 46v1"/></svg>',
    unclear: '<svg viewBox="0 0 60 60"><path d="M21 22a9 9 0 1 1 13 8c-3 2-4 4-4 7"/><path d="M30 47v1"/></svg>',
    no_signs: '<svg viewBox="0 0 60 60"><path d="M15 31l10 10 20-22"/></svg>',
  };
  window.render = (d) => {
    const $ = (id) => document.getElementById(id);
    document.documentElement.lang = d.lang;
    $("ticket").style.setProperty("--stock", `var(--stock-${d.band})`);
    $("serial").textContent = d.serial ? `No. ${d.serial}` : "";
    $("label").textContent = d.label;
    $("advice").textContent = d.advice;
    $("note").textContent = d.note || "";
    $("note").hidden = !d.note;
    $("glyph").innerHTML = GLYPHS[d.band] || "";
    $("seconds").innerHTML = "";
    if (d.stub_big) {
      $("seconds").textContent = d.stub_big;
      const s = document.createElement("small"); s.textContent = d.stub_small || ""; $("seconds").append(s);
    }
    $("by").textContent = d.checked_by;
    $("disclaimer").textContent = d.disclaimer;
    $("test").textContent = d.test || "";
    $("test").hidden = !d.test;
    $("stages").hidden = !d.bins.length;
    $("row").innerHTML = d.bins.map((b) => `<div class="stage${b >= 2 ? " punched" : b === 1 ? " one" : ""}"></div>`).join("");
    $("mid").textContent = d.axis_mid;
    $("end").textContent = d.axis_end;
    return document.fonts.ready.then(() => true);
  };
</script>
</body>
</html>
